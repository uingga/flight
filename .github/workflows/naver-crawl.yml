name: Naver Price Crawl

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00) — 마이리얼트립(3시) 이후 실행
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max_flights:
        description: '검색할 최대 항공권 수 (테스트: 3, 전체: 30)'
        required: false
        default: '30'

jobs:
  naver-crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Naver price crawler
        id: naver
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' npx tsx scripts/crawl-naver.ts
        env:
          CI: true
          MAX_FLIGHTS: ${{ github.event.inputs.max_flights || '30' }}
          SOURCE_FILTER: myrealtrip

      - name: Commit and push
        if: steps.naver.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n $(git status --porcelain data/naver-prices.json) ]]; then
            cp data/naver-prices.json /tmp/naver-prices.json

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/naver-prices.json data/naver-prices.json

            git add data/naver-prices.json
            git commit -m "chore(data): update naver prices"
            git push
            echo "✅ Naver prices updated."
          else
            echo "ℹ️ No changes."
          fi

      - name: Report result
        if: always()
        run: |
          if [[ "${{ steps.naver.outcome }}" == "success" ]]; then
            echo "✅ 네이버 크롤링 성공"
          else
            echo "❌ 네이버 크롤링 실패 — Xvfb 환경에서 차단되었을 수 있음"
            echo "💡 로컬 Mac에서 scripts/run-naver-crawl.sh 실행을 권장합니다"
          fi
