name: Naver Price Crawl (Manual Diagnostic)

on:
  # GitHub 데이터센터 환경은 네이버 운임 결과가 간헐적으로 사라지는 soft block이
  # 확인됐다. 운영 데이터 수집에는 사용하지 않고 최대 3건 상태 진단만 허용한다.
  workflow_dispatch:
    inputs:
      max_flights:
        description: '진단할 항공권 수'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'

concurrency:
  group: naver-manual-diagnostic
  cancel-in-progress: false

jobs:
  naver-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: read

    steps:
      - name: Enforce 24-hour diagnostic cooldown
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'naver-crawl.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            let recent = null;
            for (const run of runs) {
              if (
                run.id !== context.runId
                && new Date(run.updated_at || run.created_at).getTime() <= cutoff
              ) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'all',
                per_page: 100,
              });
              const sentRequest = jobs.some(job =>
                (job.steps || []).some(step =>
                  step.name === 'Run read-only Naver diagnostic'
                  && step.conclusion !== 'skipped'
                  && Boolean(step.started_at)
                  && new Date(step.started_at).getTime() > cutoff
                )
              );
              if (sentRequest) {
                recent = run;
                break;
              }
            }
            if (recent) {
              core.setFailed(`최근 24시간 내 네이버 진단 실행이 있어 요청을 시작하지 않습니다: ${recent.html_url}`);
            }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run read-only Naver diagnostic
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' npx tsx scripts/crawl-naver.ts
        env:
          CI: true
          NAVER_LIVE_RUN: '1'
          MAX_FLIGHTS: ${{ inputs.max_flights }}
          MAX_NAVIGATIONS: ${{ inputs.max_flights }}
          SOURCE_FILTER: myrealtrip
          STANDARD_REFRESH_DAYS: 0
          PRIORITY_REFRESH_DAYS: 0
          MIN_SUCCESS_REFRESH_HOURS: 24
          MISS_RETRY_HOURS: 0
          NO_RESULT_RETRY_HOURS: 0
          REQUEST_DELAY_MIN_MS: 5000
          REQUEST_DELAY_MAX_MS: 10000
          MAX_HEALTH_CHECKS: 1

      - name: Explain diagnostic scope
        if: always()
        run: |
          echo "이 워크플로는 최대 3건의 접속 상태만 확인합니다."
          echo "data 파일을 필터링하거나 커밋하지 않으며 운영 수집은 Windows TikitikitNaverCrawl 작업이 담당합니다."
