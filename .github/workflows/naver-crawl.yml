name: Naver Price Crawl

on:
  workflow_run:
    workflows: ["MyRealTrip Price Scraping"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_flights:
        description: '검색할 최대 항공권 수 (테스트: 3, 전체: 200 권장)'
        required: false
        default: '200'

jobs:
  naver-crawl:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Naver price crawler
        id: naver
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' npx tsx scripts/crawl-naver.ts
        env:
          CI: true
          MAX_FLIGHTS: ${{ github.event.inputs.max_flights || '200' }}
          SOURCE_FILTER: myrealtrip

      - name: Filter flights by Naver prices
        if: steps.naver.outcome == 'success'
        run: npx tsx scripts/filter-by-naver.ts

      - name: Commit and push
        if: steps.naver.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n $(git status --porcelain data/) ]]; then
            # 이 워크플로우의 산출물은 naver-prices.json 하나만 보관한다.
            cp data/naver-prices.json /tmp/naver-prices.json

            git fetch origin main
            git reset --hard origin/main

            # 네이버 가격만 복원하고, 캐시 필터는 원격 최신 캐시 기준으로 다시 계산한다.
            # (크롤링 ~1시간 동안 다른 워크플로우가 커밋한 최신 항공권을 덮어쓰지 않기 위함)
            cp /tmp/naver-prices.json data/naver-prices.json
            npx tsx scripts/filter-by-naver.ts

            if [[ -n $(git status --porcelain data/) ]]; then
              git add data/naver-prices.json data/all-flights-cache.json
              git commit -m "chore(data): update naver prices + filter flights"
              git push
              echo "✅ Naver prices + filtered flights updated."
            else
              echo "ℹ️ 재필터 후 변경 없음"
            fi
          else
            echo "ℹ️ No changes."
          fi

      - name: Report result
        if: always()
        run: |
          if [[ "${{ steps.naver.outcome }}" == "success" ]]; then
            echo "✅ 네이버 크롤링 성공"
          else
            echo "❌ 네이버 크롤링 실패 — Xvfb 환경에서 차단되었을 수 있음"
            echo "💡 로컬 Mac에서 scripts/run-naver-crawl.sh 실행을 권장합니다"
          fi
