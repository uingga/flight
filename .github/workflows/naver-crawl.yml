name: Naver Price Crawl

on:
  # 독립 예약을 두지 않는다. 11:56 일반 여행사 수집이 데이터를 저장한 직후
  # daily-crawl.yml이 이 워크플로우를 호출한다.
  workflow_dispatch:
    inputs:
      max_flights:
        description: '검색할 최대 항공권 수 (테스트: 3, 전체: 200 권장)'
        required: false
        default: '200'

jobs:
  naver-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Playwright install attempt ${attempt}/2"
            if timeout 240s npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt ${attempt} timed out or failed. Retrying..."
            sleep 10
          done
          echo "Playwright browser installation failed after 2 attempts."
          exit 1

      - name: Run Naver price crawler
        id: naver
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24' npx tsx scripts/crawl-naver.ts
        env:
          CI: true
          MAX_FLIGHTS: ${{ github.event.inputs.max_flights || '200' }}
          SOURCE_FILTER: myrealtrip
          REFRESH_DAYS: 2
          MYREALTRIP_REFRESH_DAYS: 1
          MISS_RETRY_HOURS: 6

      - name: Preserve failed run history
        if: ${{ always() && steps.naver.outcome == 'failure' }}
        run: |
          cp data/naver-crawl-history.json /tmp/naver-crawl-history.json

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          node scripts/merge-naver-crawl-history.mjs data/naver-crawl-history.json /tmp/naver-crawl-history.json

          if [[ -n $(git status --porcelain data/naver-crawl-history.json) ]]; then
            git add data/naver-crawl-history.json
            git commit -m "chore(data): record failed naver crawl"
            git push
          else
            echo "ℹ️ 새 네이버 실패 기록 없음"
          fi

      - name: Filter flights by Naver prices
        if: steps.naver.outcome == 'success'
        run: npx tsx scripts/filter-by-naver.ts
        env:
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-naver-lifecycle-observation.json

      - name: Commit and push
        if: steps.naver.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n $(git status --porcelain data/) ]]; then
            # 이번 실행의 가격과 회차 기록을 원격 최신 데이터 위에 다시 합친다.
            cp data/naver-prices.json /tmp/naver-prices.json
            cp data/naver-crawl-history.json /tmp/naver-crawl-history.json

            git fetch origin main
            git reset --hard origin/main

            # 네이버 가격은 노선 항목 단위로 병합 (로컬 PC 크롤링과 동시 실행 대비 — 최신 수집분이 이김)
            # 실행 기록은 회차 ID 단위로 병합하고, 캐시 필터는 원격 최신 캐시 기준으로 다시 계산한다.
            node scripts/merge-naver-prices.mjs data/naver-prices.json /tmp/naver-prices.json
            node scripts/merge-naver-crawl-history.mjs data/naver-crawl-history.json /tmp/naver-crawl-history.json
            LIFECYCLE_OBSERVATION_PATH=/tmp/tikitikit-naver-lifecycle-observation.json npx tsx scripts/filter-by-naver.ts

            if [[ -n $(git status --porcelain data/) ]]; then
              git add data/naver-prices.json data/naver-crawl-history.json data/all-flights-cache.json
              git commit -m "chore(data): update naver prices + filter flights"
              git push
              echo "✅ Naver prices + filtered flights updated."
            else
              echo "ℹ️ 재필터 후 변경 없음"
            fi
          else
            echo "ℹ️ No changes."
          fi

      - name: Record Naver comparison changes
        if: steps.naver.outcome == 'success'
        continue-on-error: true
        run: npm run record:lifecycle
        env:
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-naver-lifecycle-observation.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Report result
        if: always()
        run: |
          if [[ "${{ steps.naver.outcome }}" == "success" ]]; then
            echo "✅ 네이버 크롤링 성공"
          else
            echo "❌ 네이버 크롤링 실패 또는 부분 중단"
            echo "💡 Run Naver price crawler 로그의 HTTP/GraphQL 상태와 중단 원인을 확인하세요"
            echo "💡 로컬 PC의 TikitikitNaverCrawl 작업(매일 14:30, scripts/run-naver-crawl.ps1)이 가정용 IP로 다시 채웁니다"
          fi
