name: MyRealTrip Price Scraping

run-name: MyRealTrip Price Scraping · ${{ github.event.schedule || github.event_name }}

on:
  schedule:
    # 오전·오후 각 1회. GitHub Actions 정각 혼잡을 피하도록 분산한다.
    # 매일 오전 7시 5분 KST (22:05 UTC 전날)
    - cron: '5 22 * * *'
    # 매일 오후 6시 3분 KST (09:03 UTC)
    - cron: '3 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '최근 6시간 중복 방지를 무시하고 실행'
        required: false
        default: false
        type: boolean

# 수동 실행과 예약 실행이 겹쳐 같은 회선에서 동시에 요청하지 않는다.
concurrency:
  group: myrealtrip-price-scrape
  cancel-in-progress: false

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 최대 3시간

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record trigger metadata
        run: node scripts/check-crawl-run.mjs
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Random delay (0~3분)
        run: |
          DELAY=$((RANDOM % 180))
          echo "⏳ ${DELAY}초 대기 후 스크래핑 시작..."
          sleep $DELAY

      - name: Run MyRealTrip price scraping
        id: scrape
        run: npx tsx scripts/scrape-myrealtrip-prices.ts
        env:
          CI: true
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-mrt-lifecycle-observation.json
          FORCE_MYREALTRIP: ${{ inputs.force && '1' || '0' }}

      # 차단을 감지해 스크래퍼가 실패해도 항공권은 그대로 둔 채 24시간 회로는 반드시 저장한다.
      - name: Commit cache or circuit changes
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [[ -n $(git status --porcelain data/) ]]; then
            cp data/all-flights-cache.json /tmp/mrt-session-cache.json
            cp data/crawl-log.json /tmp/mrt-session-crawl-log.json 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            # 원격 최신 캐시를 베이스로, 이번 스크래핑의 마이리얼트립 항목만 반영한다.
            # (스크래핑에 최대 3시간 걸리는 동안 다른 워크플로우가 커밋한
            #  최신 항공권 데이터를 파일 통째 덮어쓰기로 지우지 않기 위함)
            node scripts/merge-cache-source.mjs data/all-flights-cache.json /tmp/mrt-session-cache.json myrealtrip

            # 별도 마이리얼트립 회차가 만든 실제 수집량도 원격 최신 로그에 합친다.
            # 파일 통째 복원은 같은 시간 일반 크롤이 남긴 기록을 지울 수 있으므로 금지한다.
            if [[ -f /tmp/mrt-session-crawl-log.json ]]; then
              node scripts/merge-crawl-log.mjs data/crawl-log.json /tmp/mrt-session-crawl-log.json myrealtrip
            fi

            if [[ -n $(git status --porcelain data/all-flights-cache.json data/crawl-log.json) ]]; then
              git add data/all-flights-cache.json data/crawl-log.json
              git commit -m "chore(data): update myrealtrip crawl"
              git push
              echo "✅ 마이리얼트립 가격·수집 기록 업데이트 완료"
            else
              echo "ℹ️ 병합 후 변경 없음"
            fi
          else
            echo "ℹ️ 변경 없음"
          fi

      - name: Record MyRealTrip lifecycle changes
        if: success()
        continue-on-error: true
        run: npm run record:lifecycle -- --source=myrealtrip
        env:
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-mrt-lifecycle-observation.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 마이리얼트립 스크래핑 실패 - ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`;
            const body = [
              '## 마이리얼트립 가격 스크래핑 실패',
              '',
              `- **시간**: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`,
              `- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '수동 실행: `npx tsx scripts/scrape-myrealtrip-prices.ts`',
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated']
            });
