name: MyRealTrip Price Scraping

on:
  schedule:
    # 매일 새벽 3시 KST (18:00 UTC 전날)
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 최대 3시간

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Random delay (0~3분)
        run: |
          DELAY=$((RANDOM % 180))
          echo "⏳ ${DELAY}초 대기 후 스크래핑 시작..."
          sleep $DELAY

      - name: Run MyRealTrip price scraping
        id: scrape
        continue-on-error: true
        run: npx tsx scripts/scrape-myrealtrip-prices.ts
        env:
          CI: true

      - name: Commit and push changes
        if: steps.scrape.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [[ -n $(git status --porcelain data/) ]]; then
            cp data/all-flights-cache.json /tmp/all-flights-cache.json
            
            git fetch origin main
            git reset --hard origin/main
            
            cp /tmp/all-flights-cache.json data/all-flights-cache.json
            
            git add data/all-flights-cache.json
            git commit -m "chore(data): update myrealtrip prices (Playwright)"
            git push
            echo "✅ 마이리얼트립 가격 업데이트 완료"
          else
            echo "ℹ️ 변경 없음"
          fi

      - name: Alert on failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 마이리얼트립 스크래핑 실패 - ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`;
            const body = [
              '## 마이리얼트립 가격 스크래핑 실패',
              '',
              `- **시간**: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`,
              `- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '수동 실행: `npx tsx scripts/scrape-myrealtrip-prices.ts`',
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated']
            });
