name: OnlineTour GitHub Fallback
run-name: OnlineTour GitHub Fallback · ${{ inputs.expected_at }}

on:
  workflow_dispatch:
    inputs:
      expected_at:
        description: 'PC primary failure slot (ISO 8601); eligibility is checked against main'
        required: true
        type: string

# Serialize with normal GitHub crawls, including the durable slot claim.
concurrency:
  group: daily-flight-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRAWL_EXPECTED_AT: ${{ inputs.expected_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Claim eligible slot before any site request
        id: claim
        run: |
          git pull --ff-only origin main
          node scripts/claim-online-github-fallback.mjs
      - name: Publish claim (failure means no crawl)
        id: publish_claim
        env:
          WRITER_TOKEN: ${{ vars.NAVER_COORDINATION == '1' && secrets.TIKIT_WRITER_ONLINETOUR_TOKEN || '' }}
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/all-flights-cache.json
          git commit -m 'chore(data): reserve OnlineTour GitHub fallback slot'
          NAVER_COORDINATION="${{ vars.NAVER_COORDINATION }}" TIKIT_WRITER_URL="${{ vars.NAVER_COORDINATION == '1' && vars.TIKIT_WRITER_URL || '' }}" TIKIT_WRITER_TOKEN="$WRITER_TOKEN" node scripts/writer-push.mjs onlinetour origin HEAD:main
          if [[ "${{ vars.NAVER_COORDINATION }}" == "1" ]]; then
            # This is the ephemeral Actions checkout; align after the broker-created commit.
            git fetch origin main
            git reset --hard origin/main
          fi
      - name: Install dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Collect only OnlineTour with final eligibility guard
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git pull --ff-only origin main
          npx --no-install tsx scripts/crawl-all.ts --sources=onlinetour
        env:
          CI: 'true'
          ONLINETOUR_GITHUB_FALLBACK: '1'
      - name: Publish only OnlineTour result
        env:
          WRITER_TOKEN: ${{ vars.NAVER_COORDINATION == '1' && secrets.TIKIT_WRITER_ONLINETOUR_TOKEN || '' }}
        if: steps.claim.outputs.claimed == 'true'
        run: |
          cp data/all-flights-cache.json /tmp/online-fallback-cache.json
          cp data/crawl-log.json /tmp/online-fallback-log.json
          # These are generated files in an ephemeral Actions checkout, not user edits.
          git restore --worktree -- data/
          git pull --ff-only origin main
          node scripts/merge-cache-source.mjs data/all-flights-cache.json /tmp/online-fallback-cache.json onlinetour
          node scripts/merge-crawl-log.mjs data/crawl-log.json /tmp/online-fallback-log.json onlinetour
          git add data/all-flights-cache.json data/crawl-log.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh OnlineTour from GitHub fallback'
            NAVER_COORDINATION="${{ vars.NAVER_COORDINATION }}" TIKIT_WRITER_URL="${{ vars.NAVER_COORDINATION == '1' && vars.TIKIT_WRITER_URL || '' }}" TIKIT_WRITER_TOKEN="$WRITER_TOKEN" node scripts/writer-push.mjs onlinetour origin HEAD:main
          fi
