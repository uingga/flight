name: Daily Flight Crawl

run-name: Daily Flight Crawl · ${{ github.event.schedule || inputs.trigger_source || github.event_name }} · ${{ inputs.expected_at || 'scheduled' }}

on:
  schedule:
    # 하루 6회 (KST): GitHub Actions 정각 혼잡을 피해 분 단위로 분산한다.
    #
    # 21시는 뺐다. 최근 4주 23회차를 표 단위로 세어 보니 13회(57%)가 새 표를
    # 하나도 못 찾았고 중앙값이 0이었다. 여행사 사이트 이용자가 가장 많은
    # 시간대이기도 해서, 얻는 것 없이 부담만 주는 자리였다.
    - cron: '13 23 * * *'    # 08:13 KST
    - cron: '53 0 * * *'     # 09:53 KST
    - cron: '56 2 * * *'     # 11:56 KST
    - cron: '17 6 * * *'     # 15:17 KST
    - cron: '29 9 * * *'     # 18:29 KST
    - cron: '37 15 * * *'    # 00:37 KST
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '실행 요청 출처(manual/watchdog)'
        required: false
        default: 'manual'
        type: string
      expected_at:
        description: 'watchdog이 복구할 예약 회차(ISO 8601)'
        required: false
        type: string

# 늦게 도착한 schedule과 watchdog 보조 실행이 같은 캐시를 동시에 만들지 않는다.
# 보조 실행이 먼저 끝나면 뒤늦은 schedule은 preflight에서 이미 처리된 회차로 건너뛴다.
concurrency:
  group: daily-flight-crawl
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.trigger.outputs.should_run }}
      expected_at: ${{ steps.trigger.outputs.expected_at }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record trigger and skip duplicate slot
        id: trigger
        run: node scripts/check-crawl-run.mjs
        env:
          CHECK_CACHE: '1'
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          EXPECTED_AT: ${{ inputs.expected_at }}

  crawl:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    permissions:
      contents: write # 리포지토리 커밋 권한 필요
      # 실패 알림이 이슈를 만든다. 이 권한이 없어 지금까지 403으로 조용히 실패했다.
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show trigger metadata
        run: node scripts/check-crawl-run.mjs
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          EXPECTED_AT: ${{ needs.preflight.outputs.expected_at }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Random delay (0~5분)
        run: |
          DELAY=$((RANDOM % 300))
          echo "⏳ ${DELAY}초 대기 후 크롤링 시작..."
          sleep $DELAY

      - name: Run crawler
        id: crawl
        continue-on-error: true
        run: npm run crawl:all
        env:
          CI: true
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-lifecycle-observation.json

      - name: Commit and push changes
        if: steps.crawl.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 변경된 파일이 있는지 확인
          if [[ -n $(git status --porcelain data/) ]]; then
            # 크롤링 결과 데이터 파일을 임시 보관
            cp data/all-flights-cache.json /tmp/all-flights-cache.json
            cp data/price-history.json /tmp/price-history.json 2>/dev/null || true
            cp data/crawl-log.json /tmp/crawl-log.json 2>/dev/null || true
            cp data/interpark-prices.json /tmp/interpark-prices.json 2>/dev/null || true
            # 주의: naver-prices.json은 네이버 워크플로우 소유 파일이므로 보관/복원하지 않는다.
            # (여기서 복원하면 크롤링 도중 커밋된 최신 네이버 데이터를 낡은 사본으로 덮어씀)
            
            # 원격 최신 코드를 강제로 가져와서 로컬을 동기화 (충돌 원천 차단)
            git fetch origin main
            git reset --hard origin/main
            
            # 원격의 캐시를 백업 (크롤링 사이에 커밋된 최신 마이리얼트립 데이터가 있을 수 있음)
            cp data/all-flights-cache.json /tmp/origin-cache.json 2>/dev/null || true

            # 임시 보관해둔 최신 크롤링 데이터를 다시 덮어쓰기
            cp /tmp/all-flights-cache.json data/all-flights-cache.json
            cp /tmp/price-history.json data/price-history.json 2>/dev/null || true
            cp /tmp/crawl-log.json data/crawl-log.json 2>/dev/null || true
            cp /tmp/interpark-prices.json data/interpark-prices.json 2>/dev/null || true

            # 마이리얼트립 항목만 원격 최신본으로 오버레이 (별도 워크플로우가 갱신하는 소스)
            node scripts/merge-cache-source.mjs data/all-flights-cache.json /tmp/origin-cache.json myrealtrip || echo "⚠️ MRT 오버레이 실패 — 이번 크롤링 캐시 그대로 사용"
            
            git add data/all-flights-cache.json
            git add data/price-history.json 2>/dev/null || true
            git add data/crawl-log.json 2>/dev/null || true
            git add data/interpark-prices.json 2>/dev/null || true
            git commit -m "chore(data): update flight data"
            git push
            echo "✅ Data updated and pushed."
          else
            echo "ℹ️ No changes to commit."
          fi

      # 정오 회차의 최신 데이터가 저장된 뒤에만 오늘의 표를 고른다.
      # 별도 시각 예약으로 두면 크롤링 지연 시 이전 데이터에서 선정될 수 있다.
      - name: Select today's pick from noon crawl
        if: steps.crawl.outcome == 'success' && github.event_name == 'schedule' && github.event.schedule == '56 2 * * *'
        run: |
          git pull --ff-only origin main
          node scripts/select-today-pick.mjs

      - name: Commit and push today's pick
        if: steps.crawl.outcome == 'success' && github.event_name == 'schedule' && github.event.schedule == '56 2 * * *'
        run: |
          if [[ -z $(git status --porcelain -- data/today-pick.json) ]]; then
            echo "No selection change"
            exit 0
          fi
          git add data/today-pick.json
          git commit -m "chore(data): select today pick"
          git pull --rebase origin main
          git push origin main

      - name: Archive long-term price history
        if: steps.crawl.outcome == 'success'
        continue-on-error: true
        run: npm run archive:prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Record flight lifecycle changes
        if: steps.crawl.outcome == 'success'
        continue-on-error: true
        run: npm run record:lifecycle
        env:
          LIFECYCLE_OBSERVATION_PATH: /tmp/tikitikit-lifecycle-observation.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 예전에는 크롤 단계의 실패만 알렸다. 커밋·푸시 단계가 실패하면(같은 시각에 다른
      # 워크플로가 먼저 밀어 넣은 경우 등) 잡은 빨간불이 되면서도 이 조건에 걸리지 않아,
      # 몇십 분짜리 크롤 결과가 조용히 사라졌다. failure()를 함께 본다.
      - name: Alert on failure
        if: failure() || steps.crawl.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 크롤링 실패 - ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`;
            const body = [
              '## 크롤링 실패 알림',
              '',
              `- **시간**: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`,
              `- **Workflow**: ${context.workflow}`,
              `- **크롤 단계**: ${{ steps.crawl.outcome }}`,
              `- **잡 상태**: ${{ job.status }}`,
              `- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '수동으로 확인해주세요: `npm run crawl:all`',
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated']
            });
