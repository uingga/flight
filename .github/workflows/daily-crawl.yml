name: Daily Flight Crawl

on:
  schedule:
    # 하루 7회 (KST): 오전 2시간, 오후~저녁 3시간 간격, 자정 00:30
    - cron: '0 23 * * *'     # 08:00 KST
    - cron: '0 1 * * *'      # 10:00 KST
    - cron: '0 2 * * *'      # 11:00 KST
    - cron: '0 6 * * *'      # 15:00 KST
    - cron: '0 9 * * *'      # 18:00 KST
    - cron: '0 12 * * *'     # 21:00 KST
    - cron: '30 15 * * *'    # 00:30 KST
  workflow_dispatch: # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 리포지토리 커밋 권한 필요

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Random delay (0~5분)
        run: |
          DELAY=$((RANDOM % 300))
          echo "⏳ ${DELAY}초 대기 후 크롤링 시작..."
          sleep $DELAY

      - name: Run crawler
        id: crawl
        continue-on-error: true
        run: npm run crawl:all
        env:
          CI: true
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}

      - name: Commit and push changes
        if: steps.crawl.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 변경된 파일이 있는지 확인
          if [[ -n $(git status --porcelain data/) ]]; then
            # 크롤링 결과 데이터 파일을 임시 보관
            cp data/all-flights-cache.json /tmp/all-flights-cache.json
            cp data/price-history.json /tmp/price-history.json 2>/dev/null || true
            cp data/crawl-log.json /tmp/crawl-log.json 2>/dev/null || true
            cp data/interpark-prices.json /tmp/interpark-prices.json 2>/dev/null || true
            # 주의: naver-prices.json은 네이버 워크플로우 소유 파일이므로 보관/복원하지 않는다.
            # (여기서 복원하면 크롤링 도중 커밋된 최신 네이버 데이터를 낡은 사본으로 덮어씀)
            
            # 원격 최신 코드를 강제로 가져와서 로컬을 동기화 (충돌 원천 차단)
            git fetch origin main
            git reset --hard origin/main
            
            # 원격의 캐시를 백업 (크롤링 사이에 커밋된 최신 마이리얼트립 데이터가 있을 수 있음)
            cp data/all-flights-cache.json /tmp/origin-cache.json 2>/dev/null || true

            # 임시 보관해둔 최신 크롤링 데이터를 다시 덮어쓰기
            cp /tmp/all-flights-cache.json data/all-flights-cache.json
            cp /tmp/price-history.json data/price-history.json 2>/dev/null || true
            cp /tmp/crawl-log.json data/crawl-log.json 2>/dev/null || true
            cp /tmp/interpark-prices.json data/interpark-prices.json 2>/dev/null || true

            # 마이리얼트립 항목만 원격 최신본으로 오버레이 (별도 워크플로우가 갱신하는 소스)
            node scripts/merge-cache-source.mjs data/all-flights-cache.json /tmp/origin-cache.json myrealtrip || echo "⚠️ MRT 오버레이 실패 — 이번 크롤링 캐시 그대로 사용"
            
            git add data/all-flights-cache.json
            git add data/price-history.json 2>/dev/null || true
            git add data/crawl-log.json 2>/dev/null || true
            git add data/interpark-prices.json 2>/dev/null || true
            git commit -m "chore(data): update flight data"
            git push
            echo "✅ Data updated and pushed."
          else
            echo "ℹ️ No changes to commit."
          fi

      - name: Send price alerts
        if: steps.crawl.outcome == 'success'
        continue-on-error: true
        run: npm run send:alerts
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Commit alert updates
        if: steps.crawl.outcome == 'success'
        run: |
          if [[ -n $(git status --porcelain data/alerts.json) ]]; then
            git add data/alerts.json
            git commit -m "chore: update alert timestamps [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Alert on failure
        if: steps.crawl.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 크롤링 실패 - ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`;
            const body = [
              '## 크롤링 실패 알림',
              '',
              `- **시간**: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}`,
              `- **Workflow**: ${context.workflow}`,
              `- **Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '수동으로 확인해주세요: `npm run crawl:all`',
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated']
            });
