name: Crawl Schedule Watchdog

run-name: Crawl Schedule Watchdog · ${{ github.event.schedule || github.event_name }}

on:
  # 정시 확인은 GitHub schedule과 독립적인 Supabase Cron이 운영 API를 호출한다.
  # 마이리얼트립 완료 이벤트는 외부 시계가 잠시 실패할 때를 위한 2차 확인이다.
  workflow_run:
    workflows: ['MyRealTrip Price Scraping']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: crawl-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest data
        uses: actions/checkout@v4

      - name: Record watchdog trigger metadata
        run: node scripts/check-crawl-run.mjs
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}

      - name: Check crawl freshness
        id: health
        run: node scripts/check-crawl-watchdog.mjs

      - name: Dispatch fallback crawl
        if: steps.health.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        env:
          LAST_COMPLETED_AT: ${{ steps.health.outputs.last_completed_at }}
        with:
          script: |
            const workflowId = 'daily-crawl.yml';
            const now = Date.now();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'main',
              per_page: 30,
            });

            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { planCrawlFallback } = await import(pathToFileURL(resolve('src/lib/crawl-watchdog-dispatch.mjs')).href);
            const plan = await planCrawlFallback(data.workflow_runs, process.env.LAST_COMPLETED_AT || null, {
              now,
              getJobs: async runId => {
                const response = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100,
                });
                if (!Array.isArray(response.data.jobs) || response.data.total_count !== response.data.jobs.length) throw Error('incomplete_job_list');
                return response.data.jobs;
              },
            });
            if (plan.action === 'recovery_required') {
              core.setFailed(`Collection must not be repeated: ${plan.blocker.reason}, run ${plan.blocker.runId}`);
              return;
            }
            if (plan.action !== 'dispatch') {
              core.notice(`No fallback dispatch: ${plan.action}${plan.blocker ? ` (${plan.blocker.reason})` : ''}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: {
                trigger_source: 'watchdog',
                expected_at: plan.health.expectedAt,
              },
            });
            core.warning(`Dispatched fallback for ${plan.health.expectedAt} (${plan.health.delayMinutes} minutes late).`);
