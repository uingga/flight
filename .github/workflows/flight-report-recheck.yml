name: Recheck Reported Flights

on:
  schedule:
    # 신고는 최대 15분 안에 자동 확인을 시작한다. 미처리 신고가 없으면 설치·크롤을 하지 않는다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: flight-report-recheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_reports: ${{ steps.pending.outputs.has_reports }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout report checker
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for pending reports
        id: pending
        run: node scripts/check-pending-flight-reports.mjs

  recheck:
    needs: check
    if: needs.check.outputs.has_reports == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      REPORT_BATCH_PATH: /tmp/flight-report-batch.json
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Process pending flight reports
        id: process
        run: npx tsx scripts/process-flight-reports.ts
        env:
          CI: true
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}

      - name: Publish verified flight changes
        id: publish
        shell: bash
        run: |
          cp data/all-flights-cache.json /tmp/flight-report-session-cache.json
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/merge-cache-report-sources.mjs data/all-flights-cache.json /tmp/flight-report-session-cache.json "$REPORT_BATCH_PATH"

            if git diff --quiet -- data/all-flights-cache.json; then
              echo "No verified cache change to publish."
              exit 0
            fi

            git add data/all-flights-cache.json
            git commit -m "chore(data): apply reported flight rechecks"
            if git push origin main; then
              exit 0
            fi
            echo "Another data update was pushed first; retrying ($attempt/3)."
          done

          echo "Failed to publish rechecked data after 3 attempts."
          exit 1

      - name: Save report results
        if: steps.process.outcome == 'success' && steps.publish.outcome == 'success'
        run: node scripts/finalize-flight-reports.mjs "$REPORT_BATCH_PATH"

      - name: Release reports when publishing fails
        if: failure() && steps.process.outcome == 'success' && steps.publish.outcome == 'failure'
        run: node scripts/finalize-flight-reports.mjs "$REPORT_BATCH_PATH" --release
