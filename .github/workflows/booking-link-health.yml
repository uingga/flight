name: Daily Booking Link Check

on:
  schedule:
    - cron: '10 4 * * *' # 13:10 KST, 정오 수집과 오늘의 표 선정 이후
  workflow_dispatch:

concurrency:
  group: booking-link-health
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test no-request evidence validation
        run: npm run test:booking-link-health

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check representative booking links
        run: npm run check:booking-links

      - name: Commit daily link health
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          cp data/booking-link-health.json /tmp/booking-link-health.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/booking-link-health.json data/booking-link-health.json
          git add data/booking-link-health.json
          if git diff --cached --quiet; then
            echo "No link health change"
            exit 0
          fi
          git commit -m "chore(data): record booking link health"
          git pull --rebase origin main
          git push origin main

      - name: Alert on check failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 예약 링크 자동 점검 실행 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `예약 링크 표본 점검 자체를 실행하지 못했습니다. [실행 기록 확인](${runUrl})`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
