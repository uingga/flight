<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <!-- Subtle radial glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Paper airplane gradient -->
    <linearGradient id="plane_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
    <!-- Rounded rectangle clip -->
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="64" ry="64"/>
    </clipPath>
  </defs>
  
  <!-- Rounded square background -->
  <g clip-path="url(#roundClip)">
    <rect width="512" height="512" fill="url(#bg_grad)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    
    <!-- Decorative subtle circles -->
    <circle cx="400" cy="120" r="180" fill="rgba(255,255,255,0.03)"/>
    <circle cx="100" cy="420" r="140" fill="rgba(255,255,255,0.02)"/>
    
    <!-- Paper airplane - centered and scaled up -->
    <g transform="translate(256, 240) scale(9) rotate(8)" filter="url(#shadow)">
      <path
        d="M-9.2 -0.9 L8.2 -9.1 Q10 -10 9.2 -8.2 L1.8 8.2 Q1 10 0 8.3 L-2.5 3.7 Q-3.5 2 -5.4 1.4 L-8.1 0.6 Q-10 0 -8.2 -0.9Z"
        fill="url(#plane_grad)"
        opacity="0.95"
      />
    </g>
  </g>
</svg>
