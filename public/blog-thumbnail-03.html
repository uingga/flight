<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px;
        }

        label {
            color: #888;
            font-size: 14px;
            font-family: sans-serif;
        }

        .wide-banner {
            width: 960px;
            height: 480px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
        }

        .square-thumb {
            width: 800px;
            height: 800px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
        }

        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/thumb_timing.png');
            background-size: cover;
            background-position: center;
        }

        .text-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.7) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 36px;
            z-index: 10;
        }

        .text-overlay-full {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.65) 50%, rgba(0, 0, 0, 0.3) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .line1 {
            color: white;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: -1px;
        }

        .line2 {
            color: white;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: -1px;
            margin-top: 8px;
        }

        .line-accent {
            color: #ffd700;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            margin-top: 14px;
        }

        .site-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            backdrop-filter: blur(4px);
        }

        .square-thumb .line1 {
            font-size: 80px;
            line-height: 1.15;
        }

        .square-thumb .line-accent {
            font-size: 36px;
            margin-top: 24px;
        }

        .square-thumb .site-badge {
            font-size: 24px;
            margin-top: 24px;
            padding: 8px 24px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <label>와이드 배너 (960×480) - 블로그 헤더용</label>
    <div class="wide-banner" id="wide-banner">
        <div class="bg"></div>
        <div class="text-overlay">
            <div class="line1">땡처리 항공권 예매 타이밍 ✈️</div>
            <div class="line2">언제 사야 제일 싼가?</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>

    <label>정사각 썸네일 (800×800) - 네이버 블로그 썸네일용</label>
    <div class="square-thumb" id="square-thumb">
        <div class="bg"></div>
        <div class="text-overlay-full">
            <div class="line1" style="font-size: 72px; line-height: 1.2;">땡처리 항공권<br>예매 타이밍<br>완벽 가이드 📅</div>
            <div class="line-accent">출발 며칠 전이 제일 싼가?</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>
</body>

</html>
