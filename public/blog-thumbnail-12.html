<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px; }
        label { color: #888; font-size: 14px; font-family: sans-serif; }

        .wide-banner { width: 960px; height: 480px; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; }
        .square-thumb { width: 800px; height: 800px; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; }
        .bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('images/thumb_pricing.png') center/cover; }

        .text-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.3) 100%); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 40px; z-index: 10; }
        .text-overlay-full { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.3) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }

        .line1 { color: white; font-size: 42px; font-weight: 900; text-shadow: 3px 3px 10px rgba(0,0,0,0.7); letter-spacing: -1px; }
        .line2 { color: #ccc; font-size: 36px; font-weight: 800; text-shadow: 3px 3px 10px rgba(0,0,0,0.7); margin-top: 6px; }
        .line-accent { color: #ffd700; font-size: 24px; font-weight: 800; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); margin-top: 12px; }
        .site-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 6px 20px; color: white; font-size: 16px; font-weight: 600; margin-top: 16px; backdrop-filter: blur(4px); }

        .square-thumb .line1 { font-size: 90px; line-height: 1.15; }
        .square-thumb .line2 { font-size: 42px; margin-top: 16px; }
        .square-thumb .line-accent { font-size: 42px; margin-top: 24px; }
        .square-thumb .site-badge { font-size: 24px; margin-top: 24px; padding: 8px 24px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <label>와이드 배너 (960×480)</label>
    <div class="wide-banner" id="wide-banner">
        <div class="bg"></div>
        <div class="text-overlay">
            <div class="line1">항공권 가격이 매일 바뀌는 진짜 이유 ✈️</div>
            <div class="line2">알면 더 싸게 삽니다</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>

    <label>정사각 썸네일 (800×800)</label>
    <div class="square-thumb" id="square-thumb">
        <div class="bg"></div>
        <div class="text-overlay-full">
            <div class="line1" style="font-size: 90px; line-height: 1.15;">항공권 가격이<br>매일 바뀌는<br>진짜 이유 ✈️</div>
            <div class="line-accent">알면 더 싸게 삽니다</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>
</body>

</html>
