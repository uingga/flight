<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @font-face {
        font-family: "Pretendard OG";
        src: url("/Fonts/Pretendard-OG-SemiBold.otf") format("opentype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Pretendard OG";
        src: url("/Fonts/Pretendard-OG-ExtraBold.otf") format("opentype");
        font-weight: 800;
      }
      .route,
      .price {
        font-family: "Pretendard OG", sans-serif;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="coral-overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e162f" stop-opacity="0.68" />
      <stop offset="1" stop-color="#b51f42" stop-opacity="0.56" />
    </linearGradient>
    <filter id="ticket-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#48101e" flood-opacity="0.22" />
    </filter>
    <mask id="ticket-mask">
      <rect x="70" y="175" width="940" height="730" rx="30" fill="#ffffff" />
      <circle cx="70" cy="590" r="30" fill="#000000" />
      <circle cx="1010" cy="590" r="30" fill="#000000" />
    </mask>
  </defs>

  <image href="/images/zhangjiajie-thumbnail-background.png" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  <rect width="1080" height="1080" fill="url(#coral-overlay)" />

  <rect x="70" y="175" width="940" height="730" rx="30" fill="#ffffff" opacity="0.96" filter="url(#ticket-shadow)" mask="url(#ticket-mask)" />

  <text class="route" x="540" y="320" fill="#4b5563" font-size="44" font-weight="600" letter-spacing="-1.5">9월 출발 · 제주항공</text>

  <text class="route" x="540" y="492" fill="#111827" font-size="88" font-weight="800" letter-spacing="-4.2">
    <tspan>부산</tspan>
    <tspan fill="#ff385c"> → </tspan>
    <tspan>장가계</tspan>
  </text>

  <line x1="140" y1="590" x2="940" y2="590" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round" stroke-dasharray="15 15" />

  <text class="price" x="540" y="755" fill="#ff385c" font-size="106" font-weight="800" letter-spacing="-5">왕복 219,000원</text>
  <text class="route" x="540" y="835" fill="#6b7280" font-size="39" font-weight="600" letter-spacing="-1.2">발권 수수료 포함</text>
</svg>
