<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 UX 데모</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>티키티킷: 예약 버튼 클릭 UX 테스트</h2>
        <p>아래 버튼을 눌러보세요.</p>

        <!-- 핵심 코드: target="_blank"로 새 창을 띄우고, onclick으로 현재 창의 주소를 바꿉니다 -->
        <a href="https://www.hanatour.com" target="_blank"
            onclick="setTimeout(() => { window.location.href = 'https://www.agoda.com'; }, 100);">
            <button class="btn">✈️ 특가 항공권 예약하기</button>
        </a>

        <p style="margin-top: 30px; font-size: 14px; color: #666; text-align: left;">
            <b>진행 순서:</b><br>
            1. <b>[새 창]</b>으로 '하나투어'가 열림 (유저는 여기서 예약을 진행)<br>
            2. <b>[현재 창]</b>은 0.1초 뒤에 '아고다(호텔)'로 스르륵 바뀜<br>
            <br>
            유저가 새 창에서 비행기 표 사고 다시 원래 창으로 돌아오면 자연스럽게 호텔 예약 화면을 마주하게 됩니다.
        </p>
    </div>
</body>

</html>
