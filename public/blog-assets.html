<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>티키티킷 Blog Assets</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding: 40px 20px;
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .label span {
            color: #64748b;
            font-size: 12px;
        }

        .asset-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 1. PROFILE IMAGE (512 x 512) ===== */
        .profile {
            width: 512px;
            height: 512px;
            border-radius: 120px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            box-shadow: 0 25px 80px rgba(79, 70, 229, 0.4);
        }

        .profile::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
        }

        .profile .deco-circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            top: -80px;
            right: -60px;
        }

        .profile .deco-circle-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.3);
            bottom: -40px;
            left: -30px;
        }

        .profile .plane-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
        }

        .profile .plane-wrap svg {
            filter: drop-shadow(4px 8px 20px rgba(30, 27, 75, 0.5));
        }

        .profile .brand-name {
            position: absolute;
            bottom: 110px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 900;
            font-size: 62px;
            color: #ffffff;
            letter-spacing: 0.04em;
            text-shadow: 0 4px 20px rgba(30, 27, 75, 0.4);
        }

        .profile .tagline {
            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 400;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.08em;
        }

        .profile .glass-overlay {
            position: absolute;
            inset: 0;
            border-radius: 120px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ===== 2. BANNER (966 x 260) ===== */
        .banner {
            width: 966px;
            height: 260px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(110deg, #4f46e5 0%, #6d28d9 40%, #7c3aed 60%, #a855f7 100%);
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.35);
        }

        .banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
        }

        .banner .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            background-image:
                radial-gradient(circle at 20% 30%, white 1px, transparent 1px),
                radial-gradient(circle at 60% 70%, white 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, white 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .banner .deco-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            top: -200px;
            right: -100px;
        }

        .banner .deco-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(67, 56, 202, 0.15);
            bottom: -120px;
            left: -50px;
        }

        .banner .content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 60px;
            gap: 40px;
        }

        .banner .text-area {
            flex: 1;
        }

        .banner .text-area .title {
            font-weight: 900;
            font-size: 48px;
            color: #fff;
            letter-spacing: 0.03em;
            text-shadow: 0 3px 12px rgba(30, 27, 75, 0.3);
            line-height: 1.2;
        }

        .banner .text-area .subtitle {
            font-weight: 400;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 10px;
            letter-spacing: 0.06em;
        }

        .banner .plane-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner .plane-section svg {
            filter: drop-shadow(3px 6px 15px rgba(30, 27, 75, 0.4));
        }

        .banner .trail {
            position: absolute;
            right: 140px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5));
            border-radius: 2px;
        }

        .banner .trail::before,
        .banner .trail::after {
            content: '';
            position: absolute;
            right: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
        }

        .banner .trail::before {
            right: -20px;
        }

        .banner .trail::after {
            right: -40px;
            width: 4px;
            height: 4px;
            opacity: 0.4;
        }

        .banner .glass-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
        }

        /* ===== 3. THUMBNAIL / REPRESENTATIVE IMAGE (800 x 800) ===== */
        .thumbnail {
            width: 800px;
            height: 800px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #312e81 0%, #4f46e5 30%, #7c3aed 70%, #a855f7 100%);
            box-shadow: 0 25px 80px rgba(79, 70, 229, 0.4);
        }

        .thumbnail::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.1) 0%, transparent 55%);
        }

        .thumbnail .grid-bg {
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .thumbnail .deco-ring {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .thumbnail .deco-ring-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .thumbnail .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .thumbnail .center-content svg {
            filter: drop-shadow(5px 10px 25px rgba(30, 27, 75, 0.5));
        }

        .thumbnail .main-title {
            position: absolute;
            bottom: 200px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 900;
            font-size: 80px;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 4px 25px rgba(30, 27, 75, 0.4);
            z-index: 2;
        }

        .thumbnail .main-subtitle {
            position: absolute;
            bottom: 150px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 400;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.1em;
            z-index: 2;
        }

        /* Floating price cards */
        .thumbnail .price-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 24px;
            color: #fff;
            z-index: 3;
        }

        .thumbnail .price-card .pc-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .thumbnail .price-card .pc-value {
            font-size: 24px;
            font-weight: 700;
        }

        .thumbnail .pc-1 {
            top: 180px;
            left: 80px;
            transform: rotate(-3deg);
        }

        .thumbnail .pc-2 {
            top: 250px;
            right: 80px;
            transform: rotate(2deg);
        }

        .thumbnail .pc-3 {
            bottom: 300px;
            left: 120px;
            transform: rotate(1deg);
        }

        .thumbnail .badge {
            position: absolute;
            top: 150px;
            right: 120px;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            padding: 10px 22px;
            border-radius: 30px;
            z-index: 4;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
        }

        .thumbnail .glass-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- ========== 1. PROFILE IMAGE (512x512) ========== -->
    <div class="asset-wrapper">
        <div class="label">프로필 이미지 <span>(512 × 512)</span></div>
        <div class="profile">
            <div class="deco-circle-1"></div>
            <div class="deco-circle-2"></div>
            <div class="plane-wrap">
                <svg width="160" height="160" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3.8 11.1 L20.2 2.9 Q22 2 21.2 3.8 L13.8 20.2 Q13 22 12.0 20.3 L9.5 15.7 Q8.5 14 6.6 13.4 L3.9 12.6 Q2 12 3.8 11.1Z"
                        fill="white" transform="rotate(8 12 12)" />
                </svg>
            </div>
            <div class="brand-name">티키티킷</div>
            <div class="tagline">항공권 최저가 비교</div>
            <div class="glass-overlay"></div>
        </div>
    </div>

    <!-- ========== 2. BANNER (966x260) ========== -->
    <div class="asset-wrapper">
        <div class="label">블로그 상단 배너 <span>(966 × 260)</span></div>
        <div class="banner">
            <div class="pattern"></div>
            <div class="deco-1"></div>
            <div class="deco-2"></div>
            <div class="content">
                <div class="text-area">
                    <div class="title">티키티킷</div>
                    <div class="subtitle">✈️ 항공권 최저가, 한눈에 비교하세요</div>
                </div>
                <div class="plane-section">
                    <div class="trail"></div>
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M3.8 11.1 L20.2 2.9 Q22 2 21.2 3.8 L13.8 20.2 Q13 22 12.0 20.3 L9.5 15.7 Q8.5 14 6.6 13.4 L3.9 12.6 Q2 12 3.8 11.1Z"
                            fill="white" transform="rotate(8 12 12)" />
                    </svg>
                </div>
            </div>
            <div class="glass-strip"></div>
        </div>
    </div>

    <!-- ========== 3. THUMBNAIL (800x800) ========== -->
    <div class="asset-wrapper">
        <div class="label">블로그 대표 이미지 <span>(800 × 800)</span></div>
        <div class="thumbnail">
            <div class="grid-bg"></div>
            <div class="deco-ring"></div>
            <div class="deco-ring-2"></div>

            <div class="price-card pc-1">
                <div class="pc-label">도쿄 왕복</div>
                <div class="pc-value">₩189,000</div>
            </div>
            <div class="price-card pc-2">
                <div class="pc-label">오사카 왕복</div>
                <div class="pc-value">₩215,000</div>
            </div>
            <div class="price-card pc-3">
                <div class="pc-label">방콕 왕복</div>
                <div class="pc-value">₩299,000</div>
            </div>
            <div class="badge">🔥 최저가 알림</div>

            <div class="center-content">
                <svg width="200" height="200" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3.8 11.1 L20.2 2.9 Q22 2 21.2 3.8 L13.8 20.2 Q13 22 12.0 20.3 L9.5 15.7 Q8.5 14 6.6 13.4 L3.9 12.6 Q2 12 3.8 11.1Z"
                        fill="white" fill-opacity="0.95" transform="rotate(8 12 12)" />
                </svg>
            </div>

            <div class="main-title">티키티킷</div>
            <div class="main-subtitle">여행사별 항공권 최저가 비교</div>
            <div class="glass-overlay"></div>
        </div>
    </div>

</body>

</html>
