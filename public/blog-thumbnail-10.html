<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px;
        }

        label {
            color: #888;
            font-size: 14px;
            font-family: sans-serif;
        }

        /* 와이드 배너 (960x480) - 블로그 헤더 */
        .wide-banner {
            width: 960px;
            height: 480px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
        }

        .square-thumb {
            width: 800px;
            height: 800px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
        }

        .bg-photo {
            width: 100%;
            height: 100%;
            background-image: url('images/thumb_airport.png');
            background-size: cover;
            background-position: center;
        }

        /* 와이드 텍스트 오버레이 */
        .text-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.65) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 36px;
            z-index: 10;
        }

        /* 정사각 텍스트 오버레이 */
        .text-overlay-full {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.65) 50%, rgba(0, 0, 0, 0.3) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .line1 {
            color: white;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: -1px;
        }

        .line2 {
            color: white;
            font-size: 36px;
            font-weight: 800;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: -1px;
            margin-top: 6px;
        }

        .line-accent {
            color: #ffd700;
            font-size: 28px;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            margin-top: 12px;
        }

        .site-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            backdrop-filter: blur(4px);
        }

        /* 정사각 텍스트 크기 */
        .square-thumb .line1 {
            font-size: 90px;
            line-height: 1.15;
        }

        .square-thumb .line-accent {
            font-size: 42px;
            margin-top: 24px;
        }

        .square-thumb .site-badge {
            font-size: 24px;
            margin-top: 24px;
            padding: 8px 24px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <label>💡 우클릭 → 다른 이름으로 저장 (또는 개발자 도구에서 캡처)</label>

    <label>와이드 배너 (960×480) - 블로그 헤더용</label>
    <div class="wide-banner" id="wide-banner">
        <div class="bg-photo"></div>
        <div class="text-overlay">
            <div class="line1">땡처리 항공권이 오히려 더 비싸다? ✈️</div>
            <div class="line2">비교 안 하면 손해 보는 이유</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>

    <label>정사각 썸네일 (800×800) - 네이버 블로그 썸네일용</label>
    <div class="square-thumb" id="square-thumb">
        <div class="bg-photo"></div>
        <div class="text-overlay-full">
            <div class="line1">땡처리<br>항공권이<br>더 비싸다?</div>
            <div class="line-accent">비교 안 하면 손해 💸</div>
            <div class="site-badge">티키티킷 tikitikit.kr</div>
        </div>
    </div>
</body>

</html>
